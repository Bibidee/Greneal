name: Greneal release gate

on:
  push:
  pull_request:

jobs:
  direct-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Prefetch compatible GenVM runner
        run: |
          python -c "from gltest.direct.sdk_loader import download_artifacts; download_artifacts('v0.2.16')"
      - run: python scripts/preflight.py
